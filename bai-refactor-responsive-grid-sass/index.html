<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Responsive Grid Refactored with SASS
    </title>

    <link
        rel="stylesheet"
        href="css/main.css">

</head>

<body>

    <div class="demo">

        <!-- HEADER -->

        <header class="demo-header">
        </header>

        <!-- CONTENT -->

        <main class="demo-content">

            <!-- LEFT MENU -->

            <aside class="menu">

                <div class="menu-item"></div>
                <div class="menu-item"></div>
                <div class="menu-item"></div>
                <div class="menu-item"></div>

            </aside>

            <!-- MAIN AREA -->

            <section class="main-content">

                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>

            </section>

            <!-- SIDEBAR -->

            <aside class="sidebar">

                <div class="sidebar-box"></div>

            </aside>

        </main>

        <!-- FOOTER -->

        <footer class="demo-footer">
        </footer>

        <!-- 12 COLUMN GRID OVERLAY -->

        <div class="grid-overlay">

            <div class="column"></div>
            <div class="column"></div>
            <div class="column"></div>
            <div class="column"></div>
            <div class="column"></div>
            <div class="column"></div>
            <div class="column"></div>
            <div class="column"></div>
            <div class="column"></div>
            <div class="column"></div>
            <div class="column"></div>
            <div class="column"></div>

        </div>

    </div>

    <p style="
        margin: 20px;
        line-height: 1.6;
    ">

        Resize the browser window to see the responsive grid.

    </p>

</body>

</html>
