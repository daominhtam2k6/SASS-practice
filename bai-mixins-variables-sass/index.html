<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        SASS Variables & Mixins
    </title>

    <link
        rel="stylesheet"
        href="css/main.css">

</head>

<body>

    <main style="
        width: min(900px, 90%);
        margin: 50px auto;
    ">

        <h1>
            SASS Variables & Mixins
        </h1>

        <p>

            Bài thực hành tối ưu CSS bằng biến
            và mixins trong SASS.

        </p>

        <button class="button">

            Nút sử dụng Mixin

        </button>

        <section class="card">

            <h2>
                Card sử dụng Mixin
            </h2>

            <p>

                Card này không cần lặp lại các thuộc tính
                background, padding, border-radius và box-shadow.

                Những thuộc tính đó đã được gom vào
                mixin box-style.

            </p>

        </section>

    </main>

</html>
